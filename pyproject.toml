[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qdml"
version = "0.1.0"
description = "Quantum Deep Metric Learning for Substation Defect Recognition"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pandas",
    "opencv-python",
    "scikit-learn",
    "pyyaml",
    "matplotlib",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
